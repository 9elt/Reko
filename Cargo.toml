[package]
name = "reko"
version = "0.6.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
croner = "4.0"
diesel = { version = "2.3", features = ["mysql_backend", "chrono"] }
diesel-async = { version = "0.9", features = ["mysql", "bb8", "async-connection-wrapper", "migrations"] }
diesel_migrations = "2.3"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
